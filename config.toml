[config]
version_check = false

[config.wallpaper]
# Whether to set the wallpaper or not
set = false

# The base command to run for applying the wallpaper.
# Keywords like {{ image }} or anything that works inside of hooks works here.
# You could also set a static color if you use the color keywords and the wallpaper setter supports it.
command = "swww img --transition-type center {{ image }}"

[templates.m3colors]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.local/state/quickshell/user/generated/colors.json'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland/hyprland-colors.conf'
output_path = '~/.config/hypr/colors/colors.conf'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock/hyprlock-colors.conf'
output_path = '~/.config/hypr/hyprlock/colors/colors.conf'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel/fuzzel_theme.ini'
output_path = '~/.config/fuzzel/fuzzel_theme.ini'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-3.0/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'


[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-4.0/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.kde_colors]
input_path = '~/.config/matugen/templates/kde/color.txt'
output_path = '~/.local/state/quickshell/user/generated/color.txt'

[templates.wallpaper]
input_path = '~/.config/matugen/templates/wallpaper.txt'
output_path = '~/.local/state/quickshell/user/generated/wallpaper/path.txt'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty/kitty-colors.conf'
output_path = '~/.config/kitty/colors/kitty-color.conf'
post_hook = "pkill -USR1 kitty"

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi/rofi-colors.rasi'
output_path = '~/.config/rofi/launchers/type-7/style-7.rasi'

[templates.default_rofi]
input_path = '~/.config/matugen/templates/rofi/default.rasi'
output_path = '~/.config/rofi/themes/default.rasi'

[templates.clipboard_rofi]
input_path = '~/.config/matugen/templates/rofi/clipboard.rasi'
output_path = '~/.config/rofi/themes/clipboard.rasi'

[templates.wallpaperSelect_rofi]
input_path = '~/.config/matugen/templates/rofi/wallpaper-select.rasi'
output_path = '~/.config/rofi/themes/wallpaper-select.rasi'

[templates.wifi-menu_rofi]
input_path = '~/.config/matugen/templates/rofi/wifi-menu.rasi'
output_path = '~/.config/rofi/themes/wifi-menu.rasi'

[templates.theme-selector_rofi]
input_path = '~/.config/matugen/templates/rofi/theme-selector.rasi'
output_path = '~/.config/rofi/themes/theme-selector.rasi'

[templates.wlogout]
input_path = '~/.config/matugen/templates/wlogout/colors.css'
output_path = '~/.config/wlogout/colors/color.css'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar/colors.css'
output_path = '~/.config/waybar/colors/colors.css'
post_hook = "sh -c 'sleep 0.5; pkill -SIGUSR2 waybar'"

[templates.swaync]
input_path = '~/.config/matugen/templates/swaync/colors.css'
output_path = '~/.config/swaync/colors/colors.css'
post_hook = "pkill -SIGUSR2 swaync; swaync &"

[templates.vscode]
input_path = '~/.config/matugen/templates/vscode/colors.css'
output_path = '~/.VSC_customize/colors/colors.css'
post_hook = "~/.VSC_customize/scripts/vscode-css-refresh.sh"


